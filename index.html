<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuseShorts</title>
<meta name="description" content="MuseShorts — 短内容剪辑与创意工作台。">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d10'/%3E%3Cpath d='M18 44V20l14 12 14-12v24' stroke='%2334e5a1' stroke-width='5' fill='none' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b0d10; --panel:#12161c; --line:#232a34;
    --fg:#e8eef6; --muted:#8b98a9; --accent:#34e5a1;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    padding:28px 20px;
    background-image:
      radial-gradient(900px 420px at 50% -14%, rgba(52,229,161,.13), transparent 70%),
      radial-gradient(700px 380px at 88% 108%, rgba(56,132,255,.10), transparent 70%);
    background-attachment:fixed;
  }
  .wrap{width:100%; max-width:660px}
  .brand{display:flex; align-items:center; gap:12px; margin-bottom:30px}
  .mark{
    width:42px;height:42px;border-radius:12px;flex:none;
    background:linear-gradient(160deg,#1b2430,#0e1319);
    border:1px solid var(--line);
    display:grid;place-items:center;
  }
  .mark svg{width:22px;height:22px}
  .brand h1{font-size:17px; letter-spacing:.02em; margin:0; font-weight:650}
  .brand span{display:block; font-size:12px; color:var(--muted); font-weight:400; margin-top:3px; letter-spacing:.04em}
  .card{
    background:linear-gradient(180deg, rgba(255,255,255,.028), rgba(255,255,255,0));
    border:1px solid var(--line); border-radius:18px; padding:34px 30px;
    box-shadow:0 24px 60px -30px rgba(0,0,0,.9);
  }
  h2{font-size:clamp(26px,5vw,34px); line-height:1.22; margin:0 0 14px; letter-spacing:-.01em}
  h2 em{font-style:normal; color:var(--accent)}
  p.lead{color:var(--muted); font-size:15px; line-height:1.75; margin:0 0 26px}
  .status{
    display:inline-flex; align-items:center; gap:9px;
    font-size:13px; color:#b8c6d8;
    background:rgba(52,229,161,.07); border:1px solid rgba(52,229,161,.24);
    padding:8px 14px; border-radius:999px; margin-bottom:26px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(52,229,161,.14)}
  .rows{border-top:1px solid var(--line); margin-top:8px}
  .row{
    display:flex; justify-content:space-between; gap:16px;
    padding:13px 0; border-bottom:1px solid var(--line); font-size:14px;
  }
  .row dt{color:var(--muted); margin:0}
  .row dd{margin:0; color:var(--fg); text-align:right; word-break:break-all}
  .row a{color:var(--accent); text-decoration:none; border-bottom:1px solid rgba(52,229,161,.35)}
  .row a:hover{border-bottom-color:var(--accent)}
  footer{margin-top:22px; font-size:12px; color:#5d6a7a; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap}
  @media (max-width:480px){
    .card{padding:26px 20px; border-radius:16px}
    .row{flex-direction:column; gap:4px}
    .row dd{text-align:left}
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none"><path d="M16 46V18l16 14 16-14v28" stroke="#34e5a1" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </div>
      <h1>MuseShorts<span>museshorts.loc.cc</span></h1>
    </div>

    <section class="card">
      <div class="status"><span class="dot"></span>站点已上线 · 服务运行中</div>
      <h2>短内容剪辑，<br><em>从一个 Muse 开始。</em></h2>
      <p class="lead">
        这里是 MuseShorts 的官方入口页。站点正在搭建中，域名已启用并正常运行。
        如需联系，请使用下方邮箱。
      </p>

      <dl class="rows">
        <div class="row"><dt>站点</dt><dd>museshorts.loc.cc</dd></div>
        <div class="row"><dt>状态</dt><dd>在线 · HTTPS 加密传输</dd></div>
        <div class="row"><dt>联系邮箱</dt><dd><a href="mailto:hi@museshorts.loc.cc">hi@museshorts.loc.cc</a></dd></div>
        <div class="row"><dt>更新时间</dt><dd id="updated">—</dd></div>
      </dl>
    </section>

    <footer>
      <span>© <span id="year">2026</span> MuseShorts</span>
      <span>Static site · GitHub Pages</span>
    </footer>
  </main>

<script>
  (function () {
    var d = new Date();
    document.getElementById('year').textContent = d.getFullYear();
    document.getElementById('updated').textContent =
      d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  })();
</script>
</body>
</html>
